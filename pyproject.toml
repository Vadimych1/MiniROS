[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "miniros"
version = "1.0.3"
description = "Small and powerful robot assembling tool based on ROS principles powered by Python"
authors = [
    {name = "Vadim Lebedenko (Vadimych1)", email = "vaimlebedenko0@gmail.com"}
]
requires-python = ">=3.9"
readme = "README.md"
dependencies = [
    "numpy==2.2.6",
    "platformdirs>=4.5.0",
    "msgpack>=1.1.2",
    "lz4>=4.4.4"
]

[project.optional-dependencies]
dev = ["pytest>=9.0.0", "pytest-asyncio>=1.3.0"]

[project.scripts]
miniros = "miniros.__main__:run_main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"